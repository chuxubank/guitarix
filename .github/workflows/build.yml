name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gperf \
            intltool \
            ladspa-sdk \
            libavahi-gobject-dev \
            libbluetooth-dev \
            libboost-dev \
            libboost-iostreams-dev \
            libboost-system-dev \
            libcurl4-openssl-dev \
            libeigen3-dev \
            libfftw3-dev \
            libgtk-3-dev \
            libgtkmm-3.0-dev \
            libjack-jackd2-dev \
            liblilv-dev \
            liblo-dev \
            liblrdf0-dev \
            libsndfile1-dev \
            lv2-dev \
            sassc

      - name: Configure
        working-directory: trunk
        run: python3 ./waf configure --prefix=/usr --includeresampler --includeconvolver

      - name: Build
        working-directory: trunk
        run: python3 ./waf build

      - name: Package
        working-directory: trunk
        run: |
          VERSION="$(sed -n "s/^VERSION='\(.*\)'/\1/p" wscript)"
          python3 ./waf install --destdir="$PWD/pkg"
          tar -C pkg -czf "guitarix-${VERSION}-linux-x86_64.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: guitarix-linux-x86_64
          path: trunk/guitarix-*-linux-x86_64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install \
            boost \
            eigen \
            fftw \
            gperf \
            gtk+3 \
            gtkmm3 \
            intltool \
            jack \
            lilv \
            lrdf \
            lv2 \
            libsndfile \
            pkg-config \
            sassc

      - name: Set environment variables
        run: |
          FFTW_PREFIX="$(brew --prefix fftw)"
          BOOST_PREFIX="$(brew --prefix boost)"
          RAPTOR_PREFIX="$(brew --prefix raptor)"
          # raptor include path is added explicitly because the lrdf bottle's
          # pkg-config file can reference a stale raptor Cellar path
          echo "CPATH=${FFTW_PREFIX}/include:${BOOST_PREFIX}/include:${RAPTOR_PREFIX}/include/raptor2${CPATH:+:$CPATH}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=${FFTW_PREFIX}/lib:${BOOST_PREFIX}/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${FFTW_PREFIX}/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Configure
        working-directory: trunk
        run: python3 ./waf configure --prefix=/usr/local --includeresampler --includeconvolver --no-avahi --no-bluez --no-lv2-gui

      - name: Build
        working-directory: trunk
        run: python3 ./waf build

      - name: Package
        working-directory: trunk
        run: |
          VERSION="$(sed -n "s/^VERSION='\(.*\)'/\1/p" wscript)"
          python3 ./waf install --destdir="$PWD/pkg"
          tar -C pkg -czf "guitarix-${VERSION}-macos-$(uname -m).tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: guitarix-macos
          path: trunk/guitarix-*-macos-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
